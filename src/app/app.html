<div class="app-layout">
  <!-- Top Navigation Toolbar -->
  <mat-toolbar color="primary" class="main-toolbar">
    <div class="brand">
      <a routerLink="/overview" class="brand-link">
        <mat-icon class="brand-icon">science</mat-icon>
        <span class="brand-title">Playground</span>
      </a>
      <span class="version-badge">Angular 22</span>
    </div>

    <div class="spacer"></div>

    <nav class="nav-links">
      @for (link of navLinks; track link.path) {
        <a
          mat-button
          [routerLink]="link.path"
          routerLinkActive="active-link"
          class="nav-button"
        >
          <mat-icon>{{ link.icon }}</mat-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </nav>
  </mat-toolbar>

  <!-- Router Outlet Container -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-content">
      <p>Playground interactif Angular 22 • Zoneless Change Detection • Angular Material 3</p>
    </div>
  </footer>
</div>
