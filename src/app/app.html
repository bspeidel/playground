<div class="app-layout">
  <!-- Top Navigation Toolbar -->
  <mat-toolbar color="primary" class="main-toolbar">
    <button
      mat-icon-button
      (click)="sidenav.toggle()"
      aria-label="Navigationsmenü umschalten"
      class="menu-toggle-btn"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <div class="brand">
      <a routerLink="/overview" class="brand-link">
        <mat-icon class="brand-icon">science</mat-icon>
        <span class="brand-title">Playground</span>
      </a>
      <span class="version-badge">Angular 22</span>
    </div>

    <div class="spacer"></div>

    <button
      mat-icon-button
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="
        themeService.isDark() ? 'Zu hellem Modus wechseln' : 'Zu dunklem Modus wechseln'
      "
      class="theme-toggle-btn"
    >
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </mat-toolbar>

  <!-- Sidenav Container -->
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="isSidenavOpen()"
      (openedChange)="isSidenavOpen.set($event)"
      class="main-sidenav"
    >
      <mat-nav-list class="sidenav-list">
        @for (category of navCategories; track category.name) {
          <div mat-subheader class="category-header">{{ category.name }}</div>
          @for (item of category.items; track item.path) {
            <a
              mat-list-item
              [routerLink]="item.path"
              routerLinkActive="active-nav-item"
              (click)="onNavLinkClick(sidenav)"
              class="nav-item"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
          @if (!$last) {
            <mat-divider class="category-divider" />
          }
        }
      </mat-nav-list>
    </mat-sidenav>

    <!-- Content & Footer -->
    <mat-sidenav-content class="sidenav-content">
      <!-- Router Outlet Container -->
      <main class="main-content">
        <router-outlet />
      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="footer-content">
          <p>
            Interaktiver Angular 22 Playground • Zoneless-Änderungserkennung • Angular Material 3
          </p>
        </div>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
