name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded PR builds; never cancel a deploy on master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Lint source files (ESLint)
        run: npm run lint

      - name: Execute unit tests (Jest)
        run: npm run test:coverage

      - name: Build for GitHub Pages
        run: npm run build:gh-pages

      - name: Generate 404.html for SPA routing on GitHub Pages
        run: cp dist/playground/browser/index.html dist/playground/browser/404.html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist/playground/browser'

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
